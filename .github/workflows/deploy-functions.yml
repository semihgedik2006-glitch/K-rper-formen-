name: Cloud Functions deployen

# Deployt automatisch nach Firebase:
#  - Sicherheitsregeln (firestore.rules), sobald sich die Datei ändert
#  - Cloud Functions, sobald sich functions/ ändert
#  - oder beides manuell über den "Run workflow"-Knopf im Actions-Tab
#
# Beide Aufgaben laufen als getrennte Jobs. Wenn eine scheitert, kommt die
# andere trotzdem durch – man sieht im Actions-Tab sofort, welche es war.
on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - '.firebaserc'
      - '*.html'
      - 'sw.js'
      # konfig.js hat hier zwei Monate lang GEFEHLT. Aufgefallen am
      # 10.8.2026, als der Umzug auf die Firmen-Pfade gemerged wurde und
      # kein Deploy ansprang: die Änderung lag in main und die App im
      # Betrieb las weiter die alten Pfade.
      #
      # Ausgerechnet diese Datei. Sie entscheidet, WELCHE Datenbank die
      # App anfasst — in firebase.json steht extra ein no-cache-Kopf
      # dafür, weil eine alte Fassung schlimmer wäre als eine langsame
      # Ladezeit. Genau die konnte man nicht ausrollen.
      #
      # Es gab keine Fehlermeldung. Es passierte einfach nichts, und
      # "gemerged" sah aus wie "ausgeliefert".
      - 'konfig.js'
      - 'manifest.json'
      # Ebenfalls beim Prüfen aufgefallen: Handbuch, Produktmappe und
      # die Symbole werden ausgeliefert, lösten aber nie einen Deploy aus.
      - '*.pdf'
      - 'icon.png'
      - 'icon.svg'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

jobs:
  # ── Erst PRÜFEN, dann ausrollen ──
  # Die Sicherheitsregeln sind die einzige echte Grenze dieser App. Sie
  # wurden bisher ungeprüft ausgerollt. Diese Stufe fährt den Firestore-
  # Emulator hoch und lässt drei Durchläufe dagegen laufen:
  #   security.test.js    wer darf was – und vor allem: wer darf NICHTS
  #   umzug.test.js       das Umzugswerkzeug an nachgebauten Daten
  #   funktionen.test.js  die Cloud Functions, wirklich ausgeführt
  #
  # Fällt eine Prüfung um, werden weder Regeln noch Functions ausgerollt.
  # Das Hosting läuft bewusst unabhängig weiter: die App ist die eine
  # Sache, die man notfalls schnell zurücknehmen können muss, und sie
  # hängt nicht an diesen Durchläufen.
  regeltest:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node 20 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Der Firestore-Emulator ist ein Java-Programm
      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Abhängigkeiten installieren
        working-directory: tests/rules
        run: npm install --no-audit --no-fund

      # umzug.test.js und funktionen.test.js benutzen das ECHTE Admin-SDK
      # und laden functions/index.js selbst. Beides liegt unter functions/.
      # Ohne diesen Schritt brechen sie mit "Cannot find module" ab – und
      # zwar sofort, nicht still: aber deployt würde trotzdem nichts.
      - name: Functions-Abhängigkeiten installieren
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Regeln, Umzug und Cloud Functions prüfen
        working-directory: tests/rules
        run: npm test

      # Braucht keinen Emulator: liest functions/index.js als Text und
      # schlägt bei jedem flachen Zugriff auf eine Firmen-Sammlung an –
      # auch bei einem, der erst morgen dazukommt.
      - name: Keine flachen Zugriffe in den Cloud Functions
        run: node tests/test-funktionen-pfade.js

  # ── Sicherheitsregeln ausrollen ──
  # Läuft in Sekunden. Damit muss niemand mehr Regeln von Hand in die
  # Firebase-Konsole kopieren – die Datei im Repo ist die Wahrheit.
  rules:
    needs: regeltest
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node 20 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Google-Auth (Service-Account aus GitHub-Secret)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SA_KEY }}

      - name: Firebase CLI installieren
        run: npm install -g firebase-tools

      # Auch die Speicher-Regeln. Sie lagen seit ihrer Erstellung im Projekt
      # und wurden nie ausgerollt - in Kraft war, was die Konsole beim
      # Anlegen des Speichers gesetzt hat. Im Speicher liegt der naechtliche
      # Vollexport der Datenbank; das darf nicht ausserhalb der Versions-
      # verwaltung geregelt sein.
      - name: Sicherheitsregeln deployen (Firestore + Speicher)
        run: firebase deploy --only firestore:rules,storage --project formenchat --non-interactive --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

  # ── Die App selbst (Firebase Hosting) ──
  # Zweiter Auslieferungsweg neben GitHub Pages. Grund: die Pages-Warteschlange
  # war mehrfach über eine Stunde blockiert, und dann kam gar nichts mehr an.
  # Firebase Hosting setzt ausserdem die Zwischenspeicher-Regeln selbst
  # (siehe firebase.json) - GitHub Pages schickt fest max-age=600 mit, wodurch
  # Geräte bis zu zehn Minuten lang die alte Fassung sahen.
  hosting:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node 20 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Google-Auth (Service-Account aus GitHub-Secret)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SA_KEY }}

      - name: Firebase CLI installieren
        run: npm install -g firebase-tools

      - name: App deployen
        run: firebase deploy --only hosting --project formenchat --non-interactive --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

  # ── Cloud Functions ──
  # Hängt an regeltest. Vorher stand über der Prüfstufe „fällt eine um,
  # wird nichts deployt" – das galt nur für die Regeln. Die Functions
  # gingen ungeprüft raus, obwohl funktionen.test.js genau sie prüft.
  deploy:
    needs: regeltest
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node 20 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Functions-Abhängigkeiten installieren
        working-directory: functions
        run: npm install

      - name: .env für Functions schreiben (Geheim-Schlüssel)
        # Werte in Anführungszeichen: ein Passwort kann Leerzeichen oder
        # Sonderzeichen enthalten (Google zeigt App-Passwörter z. B. in
        # Vierergruppen an). Ohne Anführungszeichen bräche die Datei dann.
        run: |
          {
            echo "BDAY_TEST_KEY="${{ secrets.BDAY_TEST_KEY }}""
            echo "GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}""
            # E-Mail-Versand: Monatsbericht und Termin-Mails (siehe MAIL-SETUP.md)
            echo "SMTP_HOST="${{ secrets.SMTP_HOST }}""
            echo "SMTP_PORT="${{ secrets.SMTP_PORT }}""
            echo "SMTP_USER="${{ secrets.SMTP_USER }}""
            echo "SMTP_PASS="${{ secrets.SMTP_PASS }}""
            echo "MAIL_FROM="${{ secrets.MAIL_FROM }}""
          } > functions/.env

      - name: Prüfen, ob der E-Mail-Versand eingerichtet ist
        # Nur ein Hinweis im Protokoll – kein Abbruch. Ohne diese Zeile merkt
        # man erst beim ersten fehlenden Bericht, dass etwas fehlt.
        run: |
          if [ -z "${{ secrets.SMTP_HOST }}" ] || [ -z "${{ secrets.SMTP_USER }}" ] || [ -z "${{ secrets.SMTP_PASS }}" ]; then
            echo "::warning::SMTP ist nicht eingerichtet – Monatsbericht und Termin-Mails werden nicht versendet. Siehe MAIL-SETUP.md"
          else
            echo "SMTP-Zugangsdaten sind hinterlegt."
          fi

      - name: Google-Auth (Service-Account aus GitHub-Secret)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SA_KEY }}

      - name: Firebase CLI installieren
        run: npm install -g firebase-tools

      - name: Functions deployen
        run: firebase deploy --only functions --project formenchat --non-interactive --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
