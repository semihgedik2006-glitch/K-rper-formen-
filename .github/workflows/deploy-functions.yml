name: Cloud Functions deployen

# Rollt nach Firebase aus, sobald sich in main etwas Ausgeliefertes ändert:
#   regeltest → rules     Sicherheitsregeln (Firestore + Speicher)
#   regeltest → deploy    Cloud Functions
#   hosting               die App selbst, unabhängig von den Prüfungen
#
# hosting hängt bewusst NICHT an regeltest: die App ist das eine, was man
# notfalls schnell zurücknehmen können muss. Folge davon ist, dass sie vor
# den Regeln draußen sein kann — gemessen rund 80 Sekunden früher.
#
# Die paths-Liste ist die Liste der ausgelieferten Dateien. Wer eine neue
# hinzufügt und sie hier vergisst, merkt nichts: es gibt keine Fehlermeldung,
# es passiert einfach kein Deploy. Genau so blieb konfig.js zwei Monate lang
# unausrollbar. tests/test-ausliefern.js prüft die Liste deshalb gegen die
# ignore-Liste aus firebase.json.
on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - '.firebaserc'
      - '*.html'
      - 'sw.js'
      - 'konfig.js'
      - 'demo-daten.js'
      - 'loesungen-basis.js'
      - 'schulungen-basis.js'
      - 'ems-wissen.js'
      - 'robots.txt'
      - 'manifest.json'
      - 'icon.png'
      - 'icon.svg'
      - '.github/workflows/deploy-functions.yml'

  # Und dieselbe Pruefung schon VOR dem Merge.
  #
  # Am 17.8. lief regeltest erst nach dem Merge — und fiel um. Der Merge
  # war da schon durch, main stand auf einem Stand, dessen Regeln nicht
  # ausgerollt werden konnten. Gemerkt hat es niemand, weil die App
  # (hosting haengt nicht an regeltest) ganz normal draussen war.
  #
  # Hier ohne paths-Filter, mit Absicht: die Liste oben ist die Liste der
  # ausgelieferten Dateien, nicht die der Dinge, die eine Regel umwerfen
  # koennen. Eine Aenderung an tests/rules/** liefert nichts aus und
  # gehoert trotzdem geprueft. Der Lauf dauert rund eine Minute.
  pull_request:
    branches: [main]

  workflow_dispatch:

jobs:
  # ── Versionen (23.9.2026) ──
  # Node 22 statt 20: Node 20 hat im April 2026 sein Lebensende erreicht,
  # und functions/package.json verlangt ohnehin 22. Die Actions laufen
  # in den neuen Hauptversionen auf Node 24. Vor dem Wechsel in den
  # jeweiligen action.yml nachgesehen, dass es die Eingaben, die hier
  # stehen, weiter gibt (node-version, distribution, java-version,
  # credentials_json).
  # Erst prüfen, dann ausrollen. Die Sicherheitsregeln sind die einzige echte
  # Grenze dieser App; fällt hier etwas um, gehen weder Regeln noch Functions
  # raus.
  regeltest:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v7

      - name: Node 22 einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Der Firestore-Emulator ist ein Java-Programm.
      - name: Java einrichten
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Abhängigkeiten installieren
        working-directory: tests/rules
        run: npm install --no-audit --no-fund

      # umzug.test.js und funktionen.test.js laden functions/index.js samt
      # Admin-SDK. Ohne diesen Schritt brechen sie mit "Cannot find module" ab.
      - name: Functions-Abhängigkeiten installieren
        working-directory: functions
        run: npm install --no-audit --no-fund

      # security.test.js  wer darf was — und vor allem: wer darf nichts
      # kreuz.test.js     dieselbe Frage über alle Firmen hinweg
      # umzug.test.js     das Umzugswerkzeug an nachgebauten Daten
      # funktionen.test.js die Cloud Functions, wirklich ausgeführt
      - name: Regeln, Umzug und Cloud Functions prüfen
        working-directory: tests/rules
        run: npm test

      # Ohne Emulator: liest functions/index.js als Text und schlägt bei jedem
      # flachen Zugriff auf eine Firmen-Sammlung an.
      - name: Keine flachen Zugriffe in den Cloud Functions
        run: node tests/test-funktionen-pfade.js

  # Die Datei im Repo ist die Wahrheit — Regeln werden nicht mehr von Hand in
  # die Firebase-Konsole kopiert. storage.rules gehört dazu: im Speicher liegt
  # der nächtliche Vollexport der Datenbank.
  # Die drei folgenden Jobs rollen wirklich aus und brauchen den
  # Service-Account. Aus einem Pull Request heraus duerfen sie NICHT
  # laufen — sonst waere jeder Zweig ein Deploy in die Produktion.
  rules:
    if: github.event_name != 'pull_request'
    needs: regeltest
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v7

      - name: Node 22 einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Google-Auth (Service-Account aus GitHub-Secret)
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SA_KEY }}

      - name: Firebase CLI installieren
        run: npm install -g firebase-tools

      - name: Sicherheitsregeln deployen (Firestore + Speicher)
        run: firebase deploy --only firestore:rules,storage --project formenchat --non-interactive --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

  # Firebase Hosting statt GitHub Pages: die Pages-Warteschlange war mehrfach
  # über eine Stunde blockiert, und Pages schickt fest max-age=600 mit — damit
  # sahen Geräte bis zu zehn Minuten lang die alte Fassung. Die Cache-Regeln
  # stehen jetzt in firebase.json.
  hosting:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v7

      - name: Node 22 einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Google-Auth (Service-Account aus GitHub-Secret)
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SA_KEY }}

      - name: Firebase CLI installieren
        run: npm install -g firebase-tools

      - name: App deployen
        run: firebase deploy --only hosting --project formenchat --non-interactive --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

  deploy:
    if: github.event_name != 'pull_request'
    needs: regeltest
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v7

      - name: Node 22 einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Functions-Abhängigkeiten installieren
        working-directory: functions
        run: npm install

      # Werte in Anführungszeichen: ein App-Passwort kann Leerzeichen
      # enthalten (Google zeigt sie in Vierergruppen an).
      - name: .env für Functions schreiben (Geheim-Schlüssel)
        run: |
          {
            echo "BDAY_TEST_KEY="${{ secrets.BDAY_TEST_KEY }}""
            echo "GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}""
            echo "SMTP_HOST="${{ secrets.SMTP_HOST }}""
            echo "SMTP_PORT="${{ secrets.SMTP_PORT }}""
            echo "SMTP_USER="${{ secrets.SMTP_USER }}""
            echo "SMTP_PASS="${{ secrets.SMTP_PASS }}""
            echo "MAIL_FROM="${{ secrets.MAIL_FROM }}""
            echo "SHEETS_URL="${{ secrets.SHEETS_URL }}""
            echo "SHEETS_TOKEN="${{ secrets.SHEETS_TOKEN }}""
            # Die Kasse. Fehlen diese Werte, laeuft die App vollstaendig
            # weiter — nur die drei Stripe-Endpunkte antworten mit
            # "Bezahlung ist noch nicht eingerichtet". Siehe docs/KASSE.md.
            echo "STRIPE_SECRET="${{ secrets.STRIPE_SECRET }}""
            echo "STRIPE_WEBHOOK_SECRET="${{ secrets.STRIPE_WEBHOOK_SECRET }}""
            echo "STRIPE_PREIS_BASIC="${{ secrets.STRIPE_PREIS_BASIC }}""
            echo "STRIPE_PREIS_BASIC_STUDIO="${{ secrets.STRIPE_PREIS_BASIC_STUDIO }}""
            echo "STRIPE_PREIS_PREMIUM="${{ secrets.STRIPE_PREIS_PREMIUM }}""
            echo "STRIPE_PREIS_PREMIUM_STUDIO="${{ secrets.STRIPE_PREIS_PREMIUM_STUDIO }}""
            echo "APP_URL="${{ secrets.APP_URL }}""
            echo "TEST_TAGE="${{ secrets.TEST_TAGE }}""
          } > functions/.env

      # Nur ein Hinweis im Protokoll, kein Abbruch — sonst fällt fehlender
      # E-Mail-Versand erst beim ersten ausbleibenden Bericht auf.
      - name: Prüfen, ob der E-Mail-Versand eingerichtet ist
        run: |
          if [ -z "${{ secrets.SMTP_HOST }}" ] || [ -z "${{ secrets.SMTP_USER }}" ] || [ -z "${{ secrets.SMTP_PASS }}" ]; then
            echo "::warning::SMTP ist nicht eingerichtet – Monatsbericht und Termin-Mails werden nicht versendet. Siehe docs/MAIL-SETUP.md"
          else
            echo "SMTP-Zugangsdaten sind hinterlegt."
          fi

      # Ebenfalls nur ein Hinweis. Ein Abbruch waere hier falsch: die App
      # soll sich ausrollen lassen, BEVOR es eine Kasse gibt — genau so
      # ist sie gebaut.
      - name: Prüfen, ob die Kasse eingerichtet ist
        run: |
          if [ -z "${{ secrets.STRIPE_SECRET }}" ]; then
            echo "::warning::Stripe ist nicht eingerichtet – die Abo-Knöpfe antworten mit einem Hinweis statt mit einer Bezahlseite. Siehe docs/KASSE.md"
          elif [ -z "${{ secrets.STRIPE_WEBHOOK_SECRET }}" ]; then
            echo "::warning::STRIPE_SECRET ist da, STRIPE_WEBHOOK_SECRET fehlt – dann kann bezahlt werden, aber die Freischaltung kommt nie an. Siehe docs/KASSE.md"
          elif [ -z "${{ secrets.STRIPE_PREIS_BASIC }}" ]; then
            echo "::warning::Stripe ist da, aber keine Preis-Kennung – die Kasse lehnt jeden Aufruf ab. Siehe docs/KASSE.md"
          else
            echo "Die Kasse ist eingerichtet."
          fi

      - name: Google-Auth (Service-Account aus GitHub-Secret)
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SA_KEY }}

      - name: Firebase CLI installieren
        run: npm install -g firebase-tools

      - name: Functions deployen
        run: firebase deploy --only functions --project formenchat --non-interactive --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
