<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<!-- Sicherheitsregel: erzeugt und geprüft von tools/csp.js. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' ; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; media-src https://firebasestorage.googleapis.com; connect-src https://firestore.googleapis.com; worker-src 'none'; manifest-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
<title>Video</title>
<!-- ══ GETEILTES VIDEO (Runde 308) ══════════════════════════════════════
     Aus dem Betrieb, 26.11.2026 (Marcel): „das man videos hochladen kann
     in der app und dann einen link schicken oder teilen kann mit dem sich
     JEDER das video angucken kann auch ohne account oder registrierung
     oder irgendwas aber nur mit dem link halt".

     Diese Seite kennt weder Anmeldung noch Firebase-SDK. Sie liest genau
     EIN Dokument – freigaben/<Kennung aus der Adresse> – über die
     öffentliche Schnittstelle und spielt das Video aus dem Video-Eimer
     ab, OHNE Download-Schlüssel. Ob das Video herauskommt, entscheidet
     storage-videos.rules bei jedem Abruf: nur solange die Freigabe
     besteht, aktiv ist und nicht abgelaufen. Zurückgezogen heisst damit
     sofort weg – auch für jemanden, der die Adresse aufgehoben hat.
     ══════════════════════════════════════════════════════════════════ -->
<style>
  :root{--bg:#0f1115;--karte:#181b22;--text:#f2f3f5;--leise:#b4b9c4;--linie:#2a2f3a}
  @media (prefers-color-scheme: light){:root{--bg:#f4f5f7;--karte:#fff;--text:#14161a;--leise:#4b5260;--linie:#dfe2e8}}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:1100px;margin:0 auto;padding:16px}
  .kopf{display:flex;align-items:center;gap:10px;margin:4px 0 14px;color:var(--leise);font-size:14px}
  .kopf b{color:var(--text);font-size:15px}
  h1{font-size:20px;line-height:1.3;margin:0 0 12px;word-wrap:break-word}
  .rahmen{background:#000;border-radius:14px;overflow:hidden;border:1px solid var(--linie)}
  video{display:block;width:100%;max-height:78vh;background:#000}
  .hinweis{background:var(--karte);border:1px solid var(--linie);border-radius:14px;padding:20px;margin-top:8px}
  .hinweis p{margin:6px 0 0;color:var(--leise)}
  .fuss{margin-top:12px;color:var(--leise);font-size:13px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <div class="kopf"><b id="vFirma">StudioChat</b><span>· geteiltes Video</span></div>
  <h1 id="vTitel" hidden></h1>
  <div class="rahmen" id="vRahmen" hidden>
    <video id="vVideo" controls playsinline preload="metadata"></video>
  </div>
  <div class="hinweis" id="vHinweis" role="status"><b>Video wird geladen …</b></div>
  <p class="fuss" id="vFuss" hidden></p>
</main>
<script src="konfig.js"></script>
<script src="v.js"></script>
</body>
</html>
