<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<style>
  :root{
    --ink:#20210F; --paper:#FFF6E2;
    --signal:#93C02F; --signal-deep:#33490F;
    --gold:#FFD873; --coral:#FF9E6B;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1080px; height:1080px; overflow:hidden; position:relative;
    font-family:'Liberation Sans', Arial, sans-serif;
    background:var(--paper);
    color:var(--ink);
  }
  .grain { position:absolute; inset:-10%; opacity:.25; mix-blend-mode:multiply; pointer-events:none; z-index:9; }

  .photo { position:absolute; left:0; right:0; overflow:hidden; }
  .photo img { width:100%; height:100%; object-fit:cover; display:block; }
  .p-top { top:0; height:366px; }
  .p-top img { object-position:50% 22%; }
  .p-bottom { top:706px; bottom:0; height:374px; }
  .p-bottom img { object-position:50% 30%; }
  .scrim-top { position:absolute; left:0; right:0; top:0; height:150px; background:linear-gradient(180deg, rgba(20,20,10,.38), transparent); }
  .scrim-bottom { position:absolute; left:0; right:0; bottom:0; height:150px; background:linear-gradient(0deg, rgba(20,20,10,.5), transparent); }

  .topbar { position:absolute; top:40px; left:56px; right:56px; display:flex; align-items:center; justify-content:space-between; z-index:5; }
  .topbar img { height:40px; filter:drop-shadow(0 2px 10px rgba(0,0,0,.35)) brightness(0) invert(1); }
  .badge { font-size:13px; letter-spacing:1px; font-weight:bold; color:#FFF6E2;
    background:rgba(20,20,10,.4); backdrop-filter:blur(6px); border:1.2px solid rgba(255,255,255,.35); border-radius:999px; padding:10px 18px;
    display:flex; align-items:center; gap:9px; }
  .badge .dot { width:7px; height:7px; border-radius:50%; background:var(--signal); box-shadow:0 0 8px var(--signal); }

  .p-chip { position:absolute; left:24px; bottom:22px; z-index:5; font-size:13px; font-weight:bold; letter-spacing:.3px;
    background:rgba(20,20,10,.42); backdrop-filter:blur(6px); color:#FFF6E2; border-radius:999px; padding:9px 16px; }
  .p-chip.light { background:rgba(255,255,255,.85); color:var(--signal-deep); left:auto; right:24px; }

  /* content seam between the two photos */
  .seam { position:absolute; left:0; right:0; top:366px; height:340px; background:var(--paper); z-index:3; padding:26px 56px 0; }
  .seam .kick { font-size:16px; letter-spacing:4px; color:#8a5a1e; font-weight:bold; margin-bottom:10px; }
  .seam h1 { font-size:58px; font-weight:800; line-height:1.0; letter-spacing:-1.6px; transform:scaleX(.95); transform-origin:left; }
  .seam h1 .g { color:var(--signal-deep); }

  .wave-wrap { position:absolute; left:56px; right:56px; bottom:14px; height:96px; }
  .wave-wrap svg { width:100%; height:100%; display:block; overflow:visible; }
  .tag { position:absolute; font-size:14px; letter-spacing:.5px; font-weight:bold; }
  .tag-rest { left:2px; top:2px; color:#a8620f; }
  .tag-go { right:0px; top:2px; color:var(--signal-deep); }

  .cta-row { position:absolute; left:56px; right:56px; bottom:52px; display:flex; align-items:center; justify-content:space-between; z-index:6; }
  .btn { background:var(--signal); color:#182006; font-weight:800; font-size:26px; letter-spacing:.2px;
    padding:22px 38px; border-radius:999px; display:inline-flex; align-items:center; gap:16px; white-space:nowrap;
    box-shadow:0 16px 32px rgba(0,0,0,.35); }
  .btn svg { flex-shrink:0; }
  .microcopy { font-size:15px; color:#FFF6E2; text-align:right; line-height:1.5; text-shadow:0 2px 10px rgba(0,0,0,.5); }
  .microcopy b { color:var(--gold); }
</style>
</head>
