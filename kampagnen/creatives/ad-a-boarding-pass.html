<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<style>
  :root{
    --ink:#20210F; --paper:#FFF6E2;
    --signal:#93C02F; --signal-deep:#33490F; --signal-glow:#B7D687;
    --gold:#FFD873; --coral:#FF9E6B; --sky:#FFE9B8;
    --line:rgba(32,33,15,.14);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1080px; height:1080px; overflow:hidden; position:relative;
    font-family:'Liberation Sans', Arial, sans-serif;
    background:linear-gradient(150deg, #FFF3D2 0%, #FFE9B0 26%, #FFD873 46%, #D9DE7E 66%, #9FC262 82%, #6E9A3B 100%);
    color:var(--ink);
  }
  .grain { position:absolute; inset:-10%; opacity:.3; mix-blend-mode:multiply; pointer-events:none; z-index:9; }
  .glow-a { position:absolute; top:-260px; left:-220px; width:660px; height:660px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.85) 0%, rgba(255,232,170,.4) 45%, transparent 72%); filter:blur(2px); z-index:0; }
  .glow-b { position:absolute; bottom:-180px; right:-160px; width:520px; height:520px; border-radius:50%;
    background:radial-gradient(circle, rgba(183,214,135,.55) 0%, transparent 70%); z-index:0; }
  .bokeh { position:absolute; border-radius:50%; background:rgba(255,255,255,.55); filter:blur(1px); z-index:0; }

  .topbar { position:absolute; top:54px; left:60px; right:60px; display:flex; align-items:center; justify-content:space-between; z-index:5; }
  .topbar img { height:44px; filter:drop-shadow(0 2px 8px rgba(32,33,15,.12)); }
  .badge { font-family:'Liberation Mono', monospace; font-size:14px; letter-spacing:1.5px; font-weight:bold; color:var(--signal-deep);
    background:rgba(255,255,255,.55); backdrop-filter:blur(6px); border:1.4px solid rgba(255,255,255,.8); border-radius:999px; padding:11px 20px 11px 16px;
    display:flex; align-items:center; gap:9px; box-shadow:0 8px 20px rgba(32,33,15,.08); }
  .badge .dot { width:8px; height:8px; border-radius:50%; background:var(--signal); box-shadow:0 0 8px var(--signal); }

  .head { position:absolute; top:150px; left:64px; right:64px; z-index:5; }
  .head .kick { font-size:18px; letter-spacing:5px; color:#8a5a1e; font-weight:bold; margin-bottom:14px; text-transform:uppercase; }
  .head h1 { font-size:88px; font-weight:800; line-height:.96; letter-spacing:-2.5px;
    transform:scaleX(0.94); transform-origin:left; text-shadow:0 4px 26px rgba(255,246,220,.5); }
  .head h1 .g { color:var(--signal-deep); }
  .head p { margin-top:20px; max-width:540px; font-size:21px; line-height:1.5; color:#3c3d24; }

  /* impulse line, glowing */
  .wave-wrap { position:absolute; left:60px; right:60px; top:466px; height:130px; z-index:2; }
  .wave-wrap svg { width:100%; height:100%; display:block; overflow:visible; }
  .tag { position:absolute; font-size:15px; letter-spacing:1px; font-weight:bold; }
  .tag-rest { left:40px; top:6px; color:#a8620f; }
  .tag-go { right:10px; top:6px; color:var(--signal-deep); }

  /* photo — big, warm, soft-framed */
  .photo-wrap { position:absolute; left:16px; right:16px; top:614px; transform:rotate(-0.9deg); z-index:3; }
  .photo-card { border-radius:26px; overflow:hidden; box-shadow:0 34px 60px rgba(40,30,10,.35); border:6px solid rgba(255,255,255,.75); }
  .photo-card img { width:100%; height:280px; object-fit:cover; object-position:50% 34%; display:block; }
  .chip { position:absolute; left:26px; bottom:26px; background:rgba(32,33,15,.55); backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.35); border-radius:999px; padding:10px 18px; display:flex; align-items:center; gap:9px;
    font-size:14px; font-weight:bold; letter-spacing:.5px; color:#FFF6E2; }
  .chip i { width:7px; height:7px; border-radius:50%; background:var(--signal); box-shadow:0 0 7px var(--signal); }
  .chip2 { position:absolute; right:26px; bottom:26px; background:rgba(255,255,255,.85); backdrop-filter:blur(6px);
    border-radius:999px; padding:10px 18px; font-size:14px; font-weight:bold; letter-spacing:.5px; color:var(--signal-deep); }

  .cta-row { position:absolute; left:60px; right:60px; bottom:52px; display:flex; align-items:center; justify-content:space-between; z-index:5; }
  .btn { background:var(--signal); color:#182006; font-weight:800; font-size:27px; letter-spacing:.2px;
    padding:23px 40px; border-radius:999px; display:inline-flex; align-items:center; gap:16px; white-space:nowrap;
    box-shadow:0 16px 32px rgba(62,90,24,.4); }
  .btn svg { flex-shrink:0; }
  .microcopy { font-size:16px; color:#4a4b2e; text-align:right; line-height:1.55; }
  .microcopy b { color:#a8620f; }
</style>
</head>
